# Exp 9 - Five Laps Using Sonic Sensor. Sizes are ESTIMATE except the 20" (508 mm) centre square.
# Obstacles sit where a robot driving each 1100 mm side reads 200 mm and turns right onto the next side.
name: Exp 9 - Five Laps
description: A square course around a 20 x 20 in centre square. One obstacle at the end of each side tells the robot (Distance sensor, 200 mm) where to turn right.
order: 4
floor: {size: [2400, 2400]}
start: {x: -550, y: -550, yaw: 90}
lines:
  - {points: [[-254, -254], [254, -254], [254, 254], [-254, 254]], closed: true, color: "#3c3c3c", width: 12}
obstacles:
  - {id: centre, shape: box, center: [0, 0], size: [508, 508], height: 120, color: "#d9d9d6"}
  - {id: obstacle_top, shape: box, center: [-550, 874], size: [300, 100], height: 200, color: "#2b2b2b"}
  - {id: obstacle_right, shape: box, center: [874, 550], size: [100, 300], height: 200, color: "#2b2b2b"}
  - {id: obstacle_bottom, shape: box, center: [550, -874], size: [300, 100], height: 200, color: "#2b2b2b"}
  - {id: obstacle_left, shape: box, center: [-874, -550], size: [100, 300], height: 200, color: "#2b2b2b"}
