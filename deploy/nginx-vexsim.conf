# nginx config for the VEX Simulator behind a sub-path.
#
# The app serves everything under /vex_cte/ (page, /vex_cte/api/..., /vex_cte/ws/... WebSocket)
# and only uses relative URLs, so any prefix in front of it works.
# Example result:  https://your.server/robotics/sim/vex_cte/
#
# 1) Put this `map` in the http { } block (e.g. /etc/nginx/conf.d/websocket-map.conf),
#    once per server - it lets the same location carry normal HTTP and WebSocket upgrades:
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2) Put these locations inside your existing server { } block.
#    Change /robotics/sim/ to whatever prefix you want (any depth works).

# no trailing slash -> add it (keeps relative URLs resolving under the prefix)
location = /robotics/sim/vex_cte {
    return 301 /robotics/sim/vex_cte/;
}

location /robotics/sim/vex_cte/ {
    # The trailing "/vex_cte/" on proxy_pass replaces the matched prefix,
    # so /robotics/sim/vex_cte/x -> http://127.0.0.1:8000/vex_cte/x
    proxy_pass http://127.0.0.1:8000/vex_cte/;

    proxy_http_version 1.1;                       # required for WebSockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # a simulation session is one long-lived WebSocket; don't cut it after 60 s idle
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;

    # IMPORTANT: the simulator runs the Python code users type ON THIS SERVER.
    # Only expose it to people you trust - e.g. your LAN and/or a password:
    # allow 192.168.0.0/16;
    # deny  all;
    # auth_basic           "VEX Simulator";
    # auth_basic_user_file /etc/nginx/.htpasswd-vexsim;   # htpasswd -c ... <user>
}
