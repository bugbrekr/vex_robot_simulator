<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulator Stats</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234d90f0'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="st-bar">
      <div class="wordmark">VEX<span>sim</span><small>Stats</small></div>
      <nav><a href="../">CTE Arm</a><a href="../iq2/">IQ 2nd gen</a></nav>
      <span class="st-live" id="live">connecting…</span>
    </header>
    <main class="st-main">
      <p class="st-note">Live server load and usage counts, updated every 2 s. Only totals are shown: nothing here identifies a browser or what it is doing.</p>
      <section class="st-tiles" id="tiles"></section>
      <section class="st-charts">
        <figure class="st-chart" id="c-cpu"></figure>
        <figure class="st-chart" id="c-mem"></figure>
        <figure class="st-chart" id="c-tabs"></figure>
        <figure class="st-chart" id="c-run"></figure>
      </section>
    </main>
    <script type="module" src="../src/stats/main.ts"></script>
  </body>
</html>
